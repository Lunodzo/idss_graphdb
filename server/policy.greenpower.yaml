# Green Power use case (-usecase gp): default policy for every partition.
# Allows the CIM MV-cable and public-register kinds to every verified requester
# (role "*" matches all roles, including "public"), so that experiments measure
# query cost without access restrictions. Per-DSO policies (coordinator-only,
# denied roles, hidden attributes) are separate files passed with -policy; see
# experiments/gp/policies/.
default: deny
rules:
  - kind: Organisation
    roles: ["*"]
    decision: allow
  - kind: Substation
    roles: ["*"]
    decision: allow
  - kind: AssetContainer
    roles: ["*"]
    decision: allow
  - kind: ACLineSegment
    roles: ["*"]
    decision: allow
  - kind: Junction
    roles: ["*"]
    decision: allow
  - kind: FailureEvent
    roles: ["*"]
    decision: allow
  - kind: WorkOrder
    roles: ["*"]
    decision: allow
  - kind: ActivityRecord
    roles: ["*"]
    decision: allow
  - kind: MeasurementValue
    roles: ["*"]
    decision: allow
