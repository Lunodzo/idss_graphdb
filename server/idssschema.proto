syntax = "proto3";

package common;

option go_package = "idss/graphdb/common"; // The package name for the generated Go code

enum MessageType {
    QUERY = 0; // A query message
    RESULT = 1; // A result message
    CUSTOMER_REGISTRATION = 2; // A customer registration message
    SETTLEMENT_REQUEST = 3; // A settlement request message
    SETTLEMENT_RESULT = 4; // A settlement result message
    REGISTRATION_ACK = 5; // A community manager's reply to a customer registration
}

// QueryMessage represents a query being propagated in the network
message QueryMessage {
    MessageType type = 1;  // To distinguish between QUERY and RESULT.
    string query = 2; // The query to be executed
    string uqid = 3; // Unique query identifier
    string timestamp = 11; // Timestamp of the query
    float ttl = 4; // Time to live
    string sender = 5; // The peer_id of the sender
    string originator = 6; // The peer_id of the originator
    QueryState state = 7; // The state of the query
    repeated string labels = 8; // The labels of the query
    repeated Row result = 9; // The result of the query
    string error = 10; // Error message if any
    int32 record_count = 12; // Number of records in the result
    string requester_id = 13; // Peer ID of the submitting client
    string requester_role = 14; // member, manager, or observer
    CustomerRegistration customer_registration = 15; // The customer registration details
    SettlementRequest settlement_request = 16; // The settlement request details
    SettlementResult settlement_result = 17; // The result of the settlement request
    repeated string responding_peer_ids = 18; // List of peer IDs that have responded to the query
}

message CustomerRegistration {
    string mrid = 1; // The market participant ID
    string name = 2; // The name of the customer
    string role = 3; // The role of the customer (e.g., member, manager, observer)
    string membership_status = 4; // The membership status of the customer
    string contract_number = 5; // The contract number associated with the customer
    string community_id = 6; // Energy community the customer joins (empty: legacy, unscoped registration)
}

message SettlementRequest {
    string from = 1; // Start of the billing period (RFC 3339)
    string to = 2; // End of the billing period (RFC 3339)
    string community_id = 3; // Community the requesting manager settles (empty: legacy, unscoped)
}

message SettlementResult {
    string peer_id = 1; // The peer ID of the node
    double meter_reading_sum = 2; // The sum of meter readings
    double trade_volume_sum = 3; // The sum of trade volumes
    string community_id = 4; // Community of the responding peer (scoped settlement only)
    string refusal = 5; // Non-empty when the peer refused the request, with the reason
}

message QueryState {
    enum State {
        QUEUED = 0; // The query is in the queue
        LOCALLY_EXECUTED = 1; // The query is executed locally
        COMPLETED = 2; // The query is completed
        SENT_BACK = 3; // Query result is sent back to the parent node
        FAILED = 4; // The query failed
    }

    State state = 1;
    repeated Row result = 2; // Optional, to store intermediate/final results if needed
}

// Row represents a single row in the query result
message Row {
    repeated string data = 1;
}

/* 
COMPILATION COMMAND
protoc --proto_path=. --go_out=. --go_opt=paths=source_relative idssschema.proto
*/